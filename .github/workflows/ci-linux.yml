name: CI - Linux (CMake)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Quick check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure (quick)
        run: cmake -S . -B build-quick -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Dry-run build (very fast)
        run: ninja -C build-quick -n || true

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
