name: CI - Windows (Visual Studio / MSBuild)

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quick-check:
    name: Quick check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick configure (detect project)
        shell: pwsh
        run: |
          $cmake = Get-ChildItem -Path . -Recurse -Filter CMakeLists.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $cmake) { Write-Host 'No CMakeLists.txt found; quick-check skipped.'; exit 0 }
          $projDir = Split-Path $cmake.FullName -Parent
          Push-Location $projDir
          $buildDir = Join-Path $projDir 'build-quick'
          if (-Not (Test-Path $buildDir)) { New-Item -ItemType Directory -Path $buildDir | Out-Null }
          Write-Host "Configuring with CMake (Ninja) in $buildDir..."
          cmake -S $projDir -B $buildDir -G 'Ninja' -DCMAKE_BUILD_TYPE=Release
          Pop-Location

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (detect .sln or CMake)
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $sln) {
            Write-Host "Found solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /m
            exit 0
          }

          Write-Host "No .sln found. Checking for CMakeLists.txt..."
          $cmake = Get-ChildItem -Path . -Recurse -Filter CMakeLists.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $cmake) {
            Write-Host "No .sln or CMakeLists.txt found in repo. Skipping build."
            exit 0
          }

          $projDir = Split-Path $cmake.FullName -Parent
          Write-Host "Found CMake project at: $($cmake.FullName) (project dir: $projDir)"
          Push-Location $projDir
          $buildDir = Join-Path $projDir "build"
          if (-Not (Test-Path $buildDir)) { New-Item -ItemType Directory -Path $buildDir | Out-Null }
          Write-Host "Configuring with CMake..."
          cmake -S $projDir -B $buildDir -A x64 -DCMAKE_BUILD_TYPE=Release
          Write-Host "Building with CMake..."
          cmake --build $buildDir --config Release -- /m
          Write-Host "Running tests (if any)..."
          if (Test-Path (Join-Path $buildDir "CTestTestfile.cmake")) {
            cmake --build $buildDir --config Release --target RUN_TESTS || true
          }
          Pop-Location
